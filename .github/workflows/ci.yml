#
# awva CI: build the SDK and the components, run their tests (Linux, macOS universal, Windows),
# run the examples (examples/: from plain C and through the SDK; non-silent, deterministic, and the
# MPE render the same as awva_render's), the fitting toolkit's tests (tools/fit), every test again
# under AddressSanitizer and UndefinedBehaviorSanitizer (Linux, the soak too), and check the format
# (clang-format 15).
name: ci
on: [push] # every branch is in this repository, so a pull request shows its branch's push run
concurrency: # a newer push to a branch cancels the run it supersedes (main's runs all finish)
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: configure
        shell: bash
        run: |
          extra=""
          [ "$RUNNER_OS" = macOS ] && extra="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          [ "$RUNNER_OS" = Windows ] && extra="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
          cmake -S sdk -B build/sdk -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo $extra
      - name: build
        run: cmake --build build/sdk
      - name: test
        run: ctest --test-dir build/sdk --output-on-failure -j 4 -LE "example|soak" # (the soak: ctest -L soak)
      - name: examples
        run: ctest --test-dir build/sdk --output-on-failure -L example -V # (-V: the hashes in the log, to compare across OSes)
      - name: generated files as committed
        shell: bash
        run: | # the factory presets' .inc files written again on this OS: the same bytes as in the repository
          cmake -P tools/presets_inc.cmake
          git diff --exit-code -- dsp/include/awva/presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fitting toolkit (tools/fit, on a synthetic reference, no download)
        shell: bash
        run: |
          python -m venv .venv-fit
          py=.venv-fit/bin/python; exe=build/sdk/awva_render
          if [ "$RUNNER_OS" = Windows ]; then py=.venv-fit/Scripts/python.exe; exe=$(cygpath -w "$PWD/build/sdk/awva_render.exe"); else exe=$PWD/$exe; fi
          $py -m pip install -q -r tools/fit/requirements.txt
          AWVA_RENDER="$exe" $py -m unittest discover -s tools/fit/tests -v
  sanitizers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: configure
        run: cmake -S sdk -B build/san -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAWVA_SANITIZE=ON
      - name: build
        run: cmake --build build/san
      - name: test # every test, the soak and the examples too; the first sanitizer error fails its test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build/san --output-on-failure -j 4
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y clang-format-15
      - run: tools/format.sh --check
